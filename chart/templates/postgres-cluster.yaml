apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: lolcatz-database
  labels:
    skaffold.dev/keep: "true"
  annotations:
    helm.sh/resource-policy: keep
spec:
  postgresql:
    extensions:
      - name: pgvector
        image:
          reference: ghcr.io/cloudnative-pg/pgvector:0.8.1-18-trixie
      - name: postgis
        ld_library_path:
          - system
        image:
          reference: ghcr.io/cloudnative-pg/postgis-extension:3.6.2-18-trixie
  bootstrap:
    initdb:
      database: lolcatz
      encoding: UTF8
      localeCType: C
      localeCollate: C
      owner: lolcatz
    recovery:
      database: lolcatz
      owner: lolcatz
      recoveryTarget:
        backupID: 20261110T081856
        targetTime: '2026-11-10T08:33:45.147594Z'
      source: cnpg-backups
    - name: cnpg-backups
      plugin:
        enabled: true
        isWALArchiver: false
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: cnpg-backups
          serverName: cnpg-backups
  storage:
    size: {{ .Values.database.storage }}
  resources:
    {{- toYaml .Values.database.resources | nindent 4 }}
