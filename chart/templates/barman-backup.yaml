apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: cnpg-backups
  namespace: {{ .Release.Namespace }}
spec:
  configuration:
    destinationPath: s3://{{ .Release.Namespace }}.cnpg-backups/

    endpointURL: http://minio.minio.svc.cluster.local:9000

    s3Credentials:
      accessKeyId:
        name: cnpg-backups
        key: accessKey

      secretAccessKey:
        name: cnpg-backups
        key: secretKey

    wal:
      compression: gzip

    data:
      compression: gzip

  retentionPolicy: "30d"
